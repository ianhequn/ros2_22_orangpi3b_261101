# Gazebo Fortress <-> ROS 2 话题桥
# direction: GZ_TO_ROS | ROS_TO_GZ | BIDIRECTIONAL
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# 不再桥接 cmd_vel：底盘已改用 ros2_control 的 diff_drive_controller，
# Gazebo 里没有插件订阅 cmd_vel 了。ROS 侧的 /cmd_vel 由 relay 直接转发给
# /diff_drive_controller/cmd_vel_unstamped，不经过 Gazebo 话题。

# 雷达：桥进来改名 scan_raw，经 laser_filters 过滤后再叫 scan。
# 车体点必须在 ROS 侧过滤（真机同样需要），不能用 Gazebo 的
# visibility_mask，否则仿真和真机走的不是同一条数据链路。
- ros_topic_name: "scan_raw"
  gz_topic_name: "scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "imu"
  gz_topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS


  